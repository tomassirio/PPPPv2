<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<!-- Add to home screen: opens full screen, without the browser bars. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" type="image/png" href="/icon-192.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#11161a" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="PPPPv2" />
		<!-- Link previews (WhatsApp, Telegram, Slack, ...): read from this HTML without running JS, so every page shares
		     them. og:image must be an absolute URL; static/og-image.png is 1200x630. -->
		<title>PPPPv2</title>
		<meta name="description" content="Pibs & Pibettes Play Pokémon V2: Gold, Silver and Crystal together, one Game Boy per Pib." />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="PPPPv2" />
		<meta property="og:title" content="Pibs & Pibettes Play Pokémon V2" />
		<meta property="og:description" content="Gold, Silver and Crystal together, one Game Boy per Pib." />
		<meta property="og:url" content="https://pppp-v2.tomassir.io/" />
		<meta property="og:image" content="https://pppp-v2.tomassir.io/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<script>
			try {
				var t = localStorage.getItem('pppp.theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
