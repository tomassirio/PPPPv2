image:
  repository: ghcr.io/tomassirio/ppppv2-backend
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 8080

# One Game Boy per player playing (v1's single console took ~1.4 cores and ~900 MiB on a Pi): room for a few at
# once on one 4-core node. The heap is a share of the memory limit (javaOpts).
# ponytail: one pod caps how many play at once; measure per-console cost on the Pi before raising.
resources:
  limits:
    cpu: "4"
    memory: 2Gi
  requests:
    cpu: "1"
    memory: 1Gi

javaOpts: "-XX:MaxRAMPercentage=75"

application:
  # Comma-separated emails seeded as admins while the allowlist is empty.
  admins: ""
  google:
    clientId: ""
    clientSecret: ""

# NAS-backed PVC created by turing-pi-server's storage chart.
# ROMs, battery saves and save states live under data/, Redis AOF under redis/.
persistence:
  existingClaim: ppppv2-data-pvc

redis:
  image: redis:7-alpine
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
