# The GitHub Actions deployer: may manage anything inside the ppppv2 namespace and nothing else (the built-in
# "admin" ClusterRole, bound only here). Applied once by hand, after turing-pi-server's storage chart has created
# the namespace (its kubeconfig goes into the pipeline's KUBECONFIG_CONTENT secret):
#   kubectl --context turing apply -f deploy/ci-access.yaml
# Its token never expires (unlike the k3s admin client certificate, which lasts a year).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
  namespace: ppppv2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer
  namespace: ppppv2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: ppppv2
---
apiVersion: v1
kind: Secret
metadata:
  name: github-deployer-token
  namespace: ppppv2
  annotations:
    kubernetes.io/service-account.name: github-deployer
type: kubernetes.io/service-account-token
